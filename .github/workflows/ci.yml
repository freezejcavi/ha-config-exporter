name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install CI tools
        run: python -m pip install "ruff==0.16.9"

      - name: Ruff
        run: ruff check ha-config-exporter/app tests

      - name: Compile
        run: python -m compileall -q ha-config-exporter/app tests

      - name: Unit tests
        env:
          PYTHONPATH: ha-config-exporter/app
        run: python -m unittest discover -s tests -v

      - name: Exporter container build smoke
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.1.0-dev.8 \
            --build-arg BUILD_ARCH=amd64 \
            -t ha-config-exporter:ci \
            ha-config-exporter
          docker inspect ha-config-exporter:ci \
            --format '{{json .Config.Cmd}}' \
            | grep -F '["/command/with-contenv","python3","/app/exporter.py"]'
