name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install CI tools
        run: python -m pip install "ruff==0.16.9"

      - name: Ruff
        run: ruff check app tests

      - name: Compile
        run: python -m compileall -q app tests

      - name: Unit tests
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -v

      - name: Exporter container build smoke
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.1.0-dev.4 \
            --build-arg BUILD_ARCH=amd64 \
            -t ha-config-exporter:ci .

      - name: Update helper syntax
        run: bash -n tools/ha-exporter-update
