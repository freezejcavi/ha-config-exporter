name: HA Config Exporter
version: 0.1.1
slug: ha_config_exporter
description: One-way Home Assistant configuration mirror for ChatGPT audit and guidance
url: https://github.com/freezejcavi/ha-config-exporter
arch:
  - aarch64
startup: once
boot: manual
init: false
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: true
  - type: all_addon_configs
    read_only: true
options:
  repository:
    url: ""
    branch_name: main
    commit_message: Home Assistant Config Snapshot
  homeassistant:
    include:
      - custom_components/anime_benchmark/**
      - custom_components/battery_health/**
      - custom_components/**/manifest.json
      - custom_components/**/strings.json
      - custom_components/**/icons.json
      - custom_components/**/*.yaml
      - custom_components/**/*.yml
      - custom_components/**/README.md
      - custom_components/**/py.typed
      - custom_components/**/translations/en.json
      - custom_components/**/translations/cs.json
    exclude:
      - custom_components/**
  addon_configs:
    include:
      - a0d7b954_nodered/flows.json
      - a0d7b954_nodered/settings.js
      - a0d7b954_nodered/package.json
      - a0d7b954_nodered/package-lock.json
    exclude:
      - a0d7b954_nodered/**
  dry_run: false
schema:
  repository:
    url: str
    branch_name: str
    commit_message: str
  homeassistant:
    include:
      - str
    exclude:
      - str
  addon_configs:
    include:
      - str
    exclude:
      - str
  dry_run: bool
