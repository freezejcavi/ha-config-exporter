name: HA Config Exporter
version: 0.1.0-dev.8
slug: ha_config_exporter
description: One-way Home Assistant configuration mirror for ChatGPT audit and guidance
url: https://github.com/freezejcavi/ha-config-exporter
arch:
  - aarch64
startup: once
boot: manual
init: false
hassio_api: true
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: true
  - type: all_addon_configs
    read_only: true
options:
  repository:
    url: git@github.com:freezejcavi/home-assistant-config-v2-test.git
    branch_name: main
    commit_message: Home Assistant Config Snapshot
  homeassistant:
    include: []
    exclude:
      - custom_components/hacs/hacs_frontend/**
      - codex_tasks/**
  addon_configs:
    include:
      - a0d7b954_nodered/flows.json
      - a0d7b954_nodered/settings.js
      - a0d7b954_nodered/package.json
      - a0d7b954_nodered/package-lock.json
    exclude:
      - a0d7b954_nodered/**
  dry_run: false
schema:
  repository:
    url: str
    branch_name: str
    commit_message: str
  homeassistant:
    include:
      - str
    exclude:
      - str
  addon_configs:
    include:
      - str
    exclude:
      - str
  dry_run: bool
